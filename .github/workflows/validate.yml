name: Validate skill and simulations
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python numerical examples
        run: python -m unittest discover -s skills/mechatronics-engineering/scripts -p 'test_*.py' -v
      - name: Browser numerical core
        run: node skills/mechatronics-engineering/scripts/test-browser-lab.cjs
      - name: Block-diagram solver
        run: node skills/mechatronics-engineering/scripts/test-block-engine.cjs
      - name: Connector gestures and graph updates
        run: node skills/mechatronics-engineering/scripts/test-builder-connections.cjs
      - name: OpenUSD integration
        run: |
          python -m pip install usd-core==26.8
          python scripts/validate_openusd.py
      - name: Build packages
        run: python scripts/build_packages.py
      - name: Validate structure, links and archive
        run: python scripts/validate_package.py
      - name: Check generated reference parity
        run: git diff --exit-code -- integrations/chatgpt skills/mechatronics-engineering/LICENSE
